# Checks on every pull request and on main: format, lint, type check, tests (the neutrality test
# included). GitHub-hosted runners, `pull_request` only (never pull_request_target), no secrets.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8
      - run: deno fmt --check
      - run: deno lint
      - run: deno check cli/main.ts
      - run: deno task test
      - name: The host binary compiles and runs
        run: deno task compile --host
