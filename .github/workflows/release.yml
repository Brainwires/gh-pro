# Release: a `v*` tag builds the precompiled gh extension (design §2). `gh extension install
# Brainwires/gh-pro` then downloads the asset for the user's platform: gh-pro-darwin-arm64,
# gh-pro-darwin-amd64, gh-pro-linux-amd64, gh-pro-linux-arm64, gh-pro-windows-amd64.exe.
# GitHub-hosted runners only; no secrets beyond the workflow's own GITHUB_TOKEN.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8
      - run: deno fmt --check
      - run: deno lint
      - run: deno check cli/main.ts
      - run: deno task test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8
      - name: The tag matches the version
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^export const VERSION = "\(.*\)";$/\1/p' shared/version.ts)
          if [ "$want" != "$have" ]; then
            echo "tag $GITHUB_REF_NAME but shared/version.ts says $have" >&2
            exit 1
          fi
      - name: Compile every target
        run: deno task compile
      - name: Checksums
        working-directory: dist
        run: sha256sum gh-pro-* > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/gh-pro-* dist/SHA256SUMS \
            --title "gh-pro $GITHUB_REF_NAME" --generate-notes --verify-tag
